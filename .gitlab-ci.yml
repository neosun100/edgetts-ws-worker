# GitLab CI for gitlab.aws.dev — mirrors .github/workflows/ci.yml.
# No dependencies to install: tests use Node's built-in test runner.
# Docker Hub node images are pullable on the internal runners.

stages:
  - test

variables:
  GIT_DEPTH: "1"

test:
  stage: test
  image: node:22-slim
  # Literal blocks (|) keep any ": " inside commands out of YAML's mapping parser.
  script:
    - |
      node --version
    - |
      node --check src/worker.js
    # Build before testing: dist/ is gitignored, so it does not exist on a fresh
    # clone, and the tests that read dist/worker.js (BUG#7c escaping regression, the
    # browser e2e suite) would skip or fail. This image has no Chrome, so the browser
    # tests still skip here — but BUG#7c now actually runs.
    - |
      npm run build
    - |
      node --check dist/worker.js
    - |
      npm test
    - |
      npm run coverage || true
    - |
      if grep -q "__test__" dist/worker.js; then
        echo "ERROR dist/worker.js still contains __test__ export"
        exit 1
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
