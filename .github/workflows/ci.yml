name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    # The suite finishes in about 30s locally. A cap well above that turns any future hang
    # into a fast, legible failure instead of a job that sits in_progress for six hours
    # burning runner minutes — which is exactly what a Chrome-that-never-starts did.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No dependencies to install — tests use Node's built-in test runner.
      - name: Syntax check
        run: node --check src/worker.js

      # Build BEFORE testing. dist/ is gitignored, so on a fresh checkout it does not
      # exist, and the browser e2e tests plus the BUG#7c escaping regression read
      # dist/worker.js. With build after test, those 6 tests failed on every CI run
      # (red since v2.8.0) while passing locally, where a stale dist/ was lying around.
      - name: Build worker bundle
        run: npm run build

      - name: Verify build output is a valid module
        run: node --check dist/worker.js

      # `npm test` globs test/** so it already includes the browser e2e suite. A separate
      # test:e2e step here would just run those tests a second time. The GitHub runner has
      # Chrome, so they really execute (on the GitLab node:22-slim image they skip).
      - name: All tests (unit + integration + regression + browser e2e)
        run: npm test

      - name: Coverage (informational)
        run: npm run coverage || true

      - name: Ensure test-only exports are stripped from the bundle
        run: |
          if grep -q "__test__" dist/worker.js; then
            echo "::error::dist/worker.js still contains __test__ export"
            exit 1
          fi
